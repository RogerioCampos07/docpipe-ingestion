services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docpipe_ingestion}
      POSTGRES_USER: ${POSTGRES_USER:-docpipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docpipe-local}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 128mb
    mem_limit: 512m

  rabbitmq:
    image: rabbitmq:4.1.4-management
    restart: unless-stopped
    hostname: ${RABBITMQ_HOSTNAME:-docpipe-rabbitmq}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-docpipe}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-docpipe}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-docpipe}
    ports:
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-mnesia-data:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    restart: unless-stopped
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /data
      - --silent
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNT_NAME:-docpipe}:${AZURITE_ACCOUNT_KEY:-ZG9jcGlwZS1sb2NhbC1vbmx5LW5vdC1zZWNyZXQ=}
    ports:
      - "${AZURITE_BIND_ADDRESS:-127.0.0.1}:${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:10000/',r=>process.exit(r.statusCode?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 384m

volumes:
  postgres-data:
  rabbitmq-mnesia-data:
  azurite-data:

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [metrics, observability]
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m

  tempo:
    image: grafana/tempo:2.8.2
    profiles: [traces, observability]
    network_mode: host
    command: [-config.file=/etc/tempo.yml]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3200/ready]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 384m

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [metrics, traces, observability]
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: docpipe-local
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_HTTP_ADDR: 127.0.0.1
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://127.0.0.1:3000/api/health >/dev/null]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:

server:
  http_listen_port: 3200
  http_listen_address: 127.0.0.1

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 127.0.0.1:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 24h
